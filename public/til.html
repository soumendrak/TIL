<script>
  var TILS = (window.TILS || []).slice().sort(function(a,b){
    return (b.date||'').localeCompare(a.date||'');
  });

  TIL.initTheme();
  function goRandom(){
    if(!TILS.length)return;
    var r=TILS[Math.floor(Math.random()*TILS.length)];
    location.href='./til.html?id='+encodeURIComponent(r.slug);
  }
  document.getElementById('randomBtn').onclick=goRandom;

  var id=new URLSearchParams(location.search).get('id');
  var idx=Math.max(0,TILS.findIndex(function(x){return x.slug===id}));
  var t=TILS[idx]||TILS[0];

  if(!t){
    document.getElementById('title').textContent='No entries yet';
    document.getElementById('body').innerHTML='<p>This journal is empty for now — check back soon.</p>';
  } else {
    var c=TIL.color((t.tags&&t.tags[0])||'note');
    document.documentElement.style.setProperty('--c',c);
    document.title=t.title+' — Dev Journal';
    document.getElementById('title').textContent=t.title;
    document.getElementById('date').textContent=t.date;
    document.getElementById('read').textContent=t.read;
    document.getElementById('postIcon').textContent=TIL.emoji(t.tags);
    document.getElementById('postIcon').style.setProperty('--c',c);
    document.getElementById('bcSlug').textContent=t.slug;
    var primary=(t.tags&&t.tags[0])||'note';
    var bcTopic=document.getElementById('bcTopic');
    bcTopic.textContent='#'+primary;
    bcTopic.href='./topic.html?t='+encodeURIComponent(primary);
    document.getElementById('pills').innerHTML=(t.tags||[]).map(function(x){
      return '<a class="pill" style="--c:'+TIL.color(x)+'" href="./topic.html?t='+
        encodeURIComponent(x)+'"><span class="swatch"></span>#'+TIL.esc(x)+'</a>';
    }).join('');

    var body=document.getElementById('body');
    body.innerHTML=t.content||('<p>'+(t.preview||'')+'</p>');

    /* syntax highlight + copy buttons */
    body.querySelectorAll('pre code').forEach(function(block){
      try{ if(window.hljs) hljs.highlightElement(block); }catch(e){}
    });
    body.querySelectorAll('pre').forEach(function(pre){
      var btn=document.createElement('button');
      btn.className='copy-btn';btn.type='button';btn.textContent='copy';
      btn.addEventListener('click',function(){
        var code=pre.querySelector('code');
        navigator.clipboard.writeText((code||pre).innerText).then(function(){
          btn.textContent='copied';btn.classList.add('done');
          setTimeout(function(){btn.textContent='copy';btn.classList.remove('done');},1600);
        });
      });
      pre.appendChild(btn);
    });

    /* prev (newer) / next (older) — TILS is newest-first */
    var newer=TILS[idx-1], older=TILS[idx+1];
    document.getElementById('prevnext').innerHTML=
      pnCard('newer',newer)+pnCard('older',older);
  }

  function pnCard(kind,entry){
    var isNext=kind==='older';
    if(!entry){
      return '<span class="pn '+(isNext?'next ':'')+'disabled">'+
        '<span class="lbl">'+(isNext?'Older →':'← Newer')+'</span>'+
        '<span class="pn-title">'+(isNext?'Nothing older':'Nothing newer')+'</span></span>';
    }
    return '<a class="pn '+(isNext?'next':'')+'" href="./til.html?id='+encodeURIComponent(entry.slug)+'">'+
      '<span class="lbl">'+(isNext?'Older → <kbd>j</kbd>':'<kbd>k</kbd> ← Newer')+'</span>'+
      '<span class="pn-title">'+TIL.esc(entry.title||entry.slug||'Untitled')+'</span></a>';
  }

  function goHome(){location.href='./index.html';}
  function goTo(entry){ if(entry) location.href='./til.html?id='+encodeURIComponent(entry.slug); }

  TIL.initShortcuts([
    {keys:['k','ArrowLeft'],hint:['k','←'],desc:'Newer post',run:function(){goTo(newer);}},
    {keys:['j','ArrowRight'],hint:['j','→'],desc:'Older post',run:function(){goTo(older);}},
    {keys:['h'],hint:['h'],desc:'Back to all entries',run:goHome},
    {keys:['r'],hint:['r'],desc:'Open a random post',run:goRandom},
    {keys:['t'],hint:['t'],desc:'Toggle light / dark theme',run:TIL.toggleTheme},
    {keys:['?'],hint:['?'],desc:'Show / hide this panel'},
  ]);

  /* reading progress */
  var bar=document.getElementById('progress');
  function updateProgress(){
    var h=document.documentElement;
    var max=h.scrollHeight-h.clientHeight;
    bar.style.width=(max>0?(h.scrollTop/max)*100:0)+'%';
  }
  document.addEventListener('scroll',updateProgress,{passive:true});
  updateProgress();
</script>
