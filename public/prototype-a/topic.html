<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>topic — til.soumendra.net</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<script>(function(){try{var t=localStorage.getItem('til-theme');if(t==='light')document.documentElement.classList.add('light');}catch(e){}})();</script>
<style>
  :root{--bg:#0a0e0a;--bg-soft:#0f140f;--fg:#c8e6c9;--fg-dim:#6a8d70;--accent:#22d36f;--amber:#f0b454;--border:#1c2a1f}
  html.light{--bg:#f6f2e7;--bg-soft:#efeada;--fg:#1a1f1a;--fg-dim:#5e6a5e;--accent:#1a7a3f;--amber:#a36b1a;--border:#d9d2bd}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;line-height:1.6}
  body{min-height:100vh;padding:24px 24px 60px;max-width:880px;margin:0 auto}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;color:var(--fg-dim);font-size:12px}
  .topbar .prompt{color:var(--accent)}
  .theme-toggle{background:transparent;border:1px solid var(--border);color:var(--fg-dim);padding:4px 10px;font:inherit;font-size:11px;cursor:pointer;border-radius:2px}
  .breadcrumb{color:var(--fg-dim);margin-bottom:8px;font-size:12px}
  h1{font-size:18px;color:var(--amber);margin-bottom:4px}
  h1::before{content:'$ grep -r --include="*.md" "tag: '}h1::after{content:'" .'}
  .meta{color:var(--fg-dim);margin-bottom:28px;font-size:12px}
  .til{padding:14px 0;border-bottom:1px dashed var(--border)}
  .til .m{color:var(--fg-dim);font-size:12px;margin-bottom:4px}
  .til .m .date{color:var(--amber)}
  .til h3{font-size:14px;font-weight:500}
  .til h3 a{color:var(--fg)}
  .til h3 a:hover{color:var(--accent)}
  .til .preview{color:var(--fg-dim);font-size:13px;margin-top:4px}
  .statusbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg-soft);border-top:1px solid var(--border);padding:6px 24px;display:flex;justify-content:space-between;color:var(--fg-dim);font-size:11px}
  .statusbar span{color:var(--accent)}
</style>
</head>
<body>
  <div class="topbar">
    <span><span class="prompt">soumendra@til</span>:~$ ls topics/<span id="topicName"></span></span>
    <button class="theme-toggle" id="themeBtn">[ toggle theme ]</button>
  </div>
  <div class="breadcrumb"><a href="./index.html">~/til</a> / <span id="bc"></span></div>
  <h1 id="title"></h1>
  <p class="meta"><span id="count">0</span> entries · sorted by date desc</p>
  <div id="list"></div>
  <div class="statusbar">
    <div>filtered view · <span id="topicS"></span></div>
    <div><a href="./index.html">← back</a></div>
  </div>
<script src="./data.js"></script>
<script>
  document.getElementById('themeBtn').onclick=function(){document.documentElement.classList.toggle('light');localStorage.setItem('til-theme',document.documentElement.classList.contains('light')?'light':'dark');};
  var t = new URLSearchParams(location.search).get('t') || 'python';
  document.getElementById('topicName').textContent = t;
  document.getElementById('bc').textContent = t;
  document.getElementById('title').textContent = t;
  document.getElementById('topicS').textContent = t;
  var filtered = TILS.filter(function(x){return x.tags.indexOf(t)>=0});
  document.getElementById('count').textContent = filtered.length;
  var listEl = document.getElementById('list');
  if(!filtered.length){listEl.innerHTML='<p style="color:var(--fg-dim);padding:24px 0">no entries yet for #'+t+'</p>';}
  filtered.forEach(function(x){
    var d = document.createElement('div');d.className='til';
    d.innerHTML='<div class="m"><span class="date">'+x.date+'</span> · '+x.read+' min</div>'+
      '<h3><a href="./til.html?id='+x.slug+'">'+x.title+'</a></h3>'+
      '<p class="preview">'+x.preview+'</p>';
    listEl.appendChild(d);
  });
</script>
</body></html>
