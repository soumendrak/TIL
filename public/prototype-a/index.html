<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>til.soumendra.net — terminal</title>
<meta name="description" content="Today I Learned — observability, AI, infra. By Soumendra." />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="canonical" href="https://til.soumendra.net/" />
<meta property="og:title" content="til.soumendra.net" />
<meta property="og:description" content="Today I Learned — observability, AI, infra." />
<meta property="og:type" content="website" />
<link rel="alternate" type="application/atom+xml" title="TIL feed" href="/feed.atom" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<script>
  (function(){try{var t=localStorage.getItem('til-theme');if(t==='light')document.documentElement.classList.add('light');}catch(e){}})();
</script>
<style>
  :root {
    --bg: #0a0e0a;
    --bg-soft: #0f140f;
    --fg: #c8e6c9;
    --fg-dim: #6a8d70;
    --accent: #22d36f;
    --amber: #f0b454;
    --border: #1c2a1f;
    --cursor: #22d36f;
  }
  html.light {
    --bg: #f6f2e7;
    --bg-soft: #efeada;
    --fg: #1a1f1a;
    --fg-dim: #5e6a5e;
    --accent: #1a7a3f;
    --amber: #a36b1a;
    --border: #d9d2bd;
    --cursor: #1a7a3f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg);font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;padding:24px 24px 60px;max-width:880px;margin:0 auto}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;color:var(--fg-dim);font-size:12px}
  .topbar .prompt{color:var(--accent)}
  .theme-toggle{background:transparent;border:1px solid var(--border);color:var(--fg-dim);padding:4px 10px;font:inherit;font-size:11px;cursor:pointer;border-radius:2px}
  .theme-toggle:hover{color:var(--fg);border-color:var(--fg-dim)}
  .ascii{color:var(--accent);white-space:pre;font-size:11px;line-height:1.2;margin-bottom:8px;overflow:hidden}
  h1.banner{font-size:14px;color:var(--amber);margin-bottom:4px}
  .sub{color:var(--fg-dim);margin-bottom:32px}
  .sub::after{content:'_';color:var(--cursor);animation:blink 1s steps(1) infinite;margin-left:2px}
  @keyframes blink{50%{opacity:0}}
  .section-title{color:var(--amber);margin:24px 0 12px;font-size:13px}
  .section-title::before{content:'## '}
  .tags{display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:8px}
  .tag{color:var(--fg-dim);cursor:pointer;font-size:13px}
  .tag::before{content:'$ ';color:var(--accent)}
  .tag:hover{color:var(--accent)}
  .tag .count{color:var(--fg-dim);opacity:.6;margin-left:2px}
  .til-list{list-style:none;margin-top:16px}
  .til{padding:14px 0;border-bottom:1px dashed var(--border)}
  .til:last-child{border-bottom:none}
  .til .meta{color:var(--fg-dim);font-size:12px;margin-bottom:4px}
  .til .meta .date{color:var(--amber)}
  .til h3{font-size:14px;font-weight:500}
  .til h3 a{color:var(--fg)}
  .til h3 a:hover{color:var(--accent)}
  .til .preview{color:var(--fg-dim);font-size:13px;margin-top:4px}
  .til .til-tags{margin-top:6px;color:var(--fg-dim);font-size:12px}
  .til .til-tags span{color:var(--accent);margin-right:8px}
  .statusbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg-soft);border-top:1px solid var(--border);padding:6px 24px;display:flex;justify-content:space-between;color:var(--fg-dim);font-size:11px;backdrop-filter:blur(6px)}
  .statusbar .left span{color:var(--amber)}
  .statusbar .right span{color:var(--accent)}
</style>
</head>
<body>
  <div class="topbar">
    <span><span class="prompt">soumendra@til</span>:~$ cat index</span>
    <button class="theme-toggle" id="themeBtn">[ toggle theme ]</button>
  </div>

  <pre class="ascii"> _   _ _
| |_(_) |
| __| | |
| |_| | |
 \__|_|_|  today i learned</pre>
  <h1 class="banner"># til.soumendra.net</h1>
  <p class="sub">notes from an AI observability engineer @ PepsiCo</p>

  <h2 class="section-title">topics</h2>
  <div class="tags" id="tags"></div>

  <h2 class="section-title">recent</h2>
  <ul class="til-list" id="list"></ul>

  <div class="statusbar">
    <div class="left">TIL · <span id="count">0</span> entries · last updated <span id="last">—</span></div>
    <div class="right">UTF-8 · <span>main</span> · 0:0</div>
  </div>

<script src="./data.js"></script>
<script>
  document.getElementById('themeBtn').onclick = function(){
    document.documentElement.classList.toggle('light');
    localStorage.setItem('til-theme', document.documentElement.classList.contains('light') ? 'light' : 'dark');
  };
  var tagsEl = document.getElementById('tags');
  var counts = {};
  TILS.forEach(function(t){t.tags.forEach(function(tag){counts[tag]=(counts[tag]||0)+1});});
  Object.keys(counts).sort().forEach(function(tag){
    var a = document.createElement('a');
    a.className = 'tag';
    a.href = './topic.html?t=' + encodeURIComponent(tag);
    a.innerHTML = tag + ' <span class="count">(' + counts[tag] + ')</span>';
    tagsEl.appendChild(a);
  });
  var listEl = document.getElementById('list');
  TILS.forEach(function(t){
    var li = document.createElement('li');
    li.className = 'til';
    li.innerHTML =
      '<div class="meta"><span class="date">' + t.date + '</span> · ' + t.read + ' min read</div>' +
      '<h3><a href="./til.html?id=' + t.slug + '">' + t.title + '</a></h3>' +
      '<p class="preview">' + t.preview + '</p>' +
      '<div class="til-tags">' + t.tags.map(function(x){return '<span>#'+x+'</span>'}).join('') + '</div>';
    listEl.appendChild(li);
  });
  document.getElementById('count').textContent = TILS.length;
  document.getElementById('last').textContent = TILS[0].date;
</script>
</body>
</html>
