<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Topic — Dev Journal</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="alternate icon" href="/icon-180.png" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<meta name="theme-color" content="#ff7a45" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script>(function(){try{var t=localStorage.getItem('til-theme-c');if(t!=='light')document.documentElement.classList.add('dark');}catch(e){document.documentElement.classList.add('dark');}})();</script>
<link rel="stylesheet" href="./style.css?v=b98d3c12" />
<style>
  .wrap{max-width:880px;margin:0 auto;padding:44px 32px 80px}
  .crumbs{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--fg-dim);
    margin-bottom:24px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .crumbs a:hover{color:var(--accent)}
  .crumbs .sep{color:var(--fg-soft)}

  .topic-head{
    position:relative;padding:30px 30px;border-radius:20px;margin-bottom:34px;
    border:1px solid color-mix(in oklab,var(--c) 32%,var(--border));
    background:
      linear-gradient(135deg,color-mix(in oklab,var(--c) 13%,var(--surface)),var(--surface) 70%);
    overflow:hidden;
  }
  .topic-head::after{content:'';position:absolute;right:-40px;top:-40px;
    width:200px;height:200px;border-radius:50%;
    background:radial-gradient(color-mix(in oklab,var(--c) 26%,transparent),transparent 70%)}
  .topic-emoji{width:56px;height:56px;border-radius:15px;font-size:30px;
    display:flex;align-items:center;justify-content:center;margin-bottom:16px;
    background:color-mix(in oklab,var(--c) 18%,var(--surface));
    border:1px solid color-mix(in oklab,var(--c) 32%,transparent)}
  .topic-head h1{font-size:clamp(30px,4.5vw,44px);font-weight:700;letter-spacing:-.03em;
    line-height:1.1;display:flex;align-items:baseline;gap:4px}
  .topic-head h1 .hash{color:var(--c)}
  .topic-head .meta{margin-top:10px;font-family:'JetBrains Mono',monospace;
    font-size:13px;color:var(--fg-dim)}
  .topic-head .meta strong{color:var(--fg)}

  .sec-h{font-size:11px;text-transform:uppercase;letter-spacing:.13em;
    color:var(--fg-soft);font-weight:600;margin-bottom:14px}
  .related{display:flex;flex-wrap:wrap;gap:8px;margin-top:40px}

  @media(max-width:560px){.wrap{padding:32px 20px 60px}.topic-head{padding:24px 22px}}
</style>
    <script
    src="https://rybbit.ekathi.com/api/script.js"
    data-site-id="4e41dbe31741"
    defer
></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./index.html">dev<span class="dot">.</span>journal</a>
  <div class="topbar-right">
    <button class="theme-toggle" data-theme-toggle>
      <span data-theme-label>Theme</span><span data-theme-icon>◐</span><kbd>t</kbd>
    </button>
  </div>
</header>

<div class="wrap">
  <nav class="crumbs">
    <a href="./index.html">~/journal</a>
    <span class="sep">/</span>
    <span>topics</span>
    <span class="sep">/</span>
    <span id="bc"></span>
  </nav>

  <div class="topic-head" id="topicHead">
    <div class="topic-emoji" id="emoji">📝</div>
    <h1><span class="hash">#</span><span id="title"></span></h1>
    <p class="meta"><strong id="count">0</strong> entries filed under this topic</p>
  </div>

  <h4 class="sec-h" id="listHead">Entries</h4>
  <p class="khint" id="listHint" style="margin:-4px 0 14px">
    <kbd>j</kbd> <kbd>k</kbd> browse · <kbd>↵</kbd> open · <kbd>h</kbd> home · <kbd>?</kbd> shortcuts
  </p>
  <div class="list" id="list"></div>

  <div id="relatedWrap" style="display:none">
    <h4 class="sec-h" style="margin-top:42px">Related topics</h4>
    <div class="related" id="related"></div>
  </div>

  <footer class="page-foot">
    <span>A journal by <a class="namelink" href="https://www.soumendrak.com" target="_blank" rel="noreferrer">Soumendra Kumar Sahoo</a></span>
    <span class="sep">·</span>
    <a href="https://github.com/soumendrak/til" target="_blank" rel="noreferrer">GitHub ↗</a>
  </footer>
</div>

<script src="./data.js?v=b98d3c12"></script>
<script src="./app.js?v=b98d3c12"></script>
<script>
  var TILS = (window.TILS || []).slice().sort(function(a,b){
    return (b.date||'').localeCompare(a.date||'');
  });
  TIL.initTheme();

  var topic=new URLSearchParams(location.search).get('t')||'';
  var c=TIL.color(topic||'note');
  document.documentElement.style.setProperty('--c',c);
  document.getElementById('topicHead').style.setProperty('--c',c);
  document.getElementById('emoji').style.setProperty('--c',c);

  document.getElementById('title').textContent=topic;
  document.getElementById('bc').textContent='#'+topic;
  document.getElementById('emoji').textContent=TIL.emoji([topic]);
  document.title='#'+topic+' — Dev Journal';

  var entries=TILS.filter(function(x){return (x.tags||[]).indexOf(topic)>=0});
  document.getElementById('count').textContent=entries.length;

  var listEl=document.getElementById('list');
  if(!entries.length){
    document.getElementById('listHead').style.display='none';
    document.getElementById('listHint').style.display='none';
    listEl.className='';
    listEl.innerHTML='<div class="empty"><span class="big">🪴</span>'+
      'No entries filed under #'+TIL.esc(topic)+' yet.<br>'+
      '<a href="./index.html" style="color:var(--accent)">Browse everything →</a></div>';
  } else {
    listEl.innerHTML=entries.map(function(t){
      var tc=TIL.color((t.tags&&t.tags[0])||'note');
      var primary=(t.tags&&t.tags[0])||'note';
      return '<a class="item" data-reveal style="--c:'+tc+'" href="./til.html?id='+encodeURIComponent(t.slug)+'">'+
        '<span class="t-icon">'+TIL.emoji(t.tags)+'</span>'+
        '<span class="entry-body">'+
          '<span class="entry-meta">'+TIL.esc(t.date||'')+' &nbsp;·&nbsp; '+TIL.esc(t.read||'1')+
            ' min &nbsp;·&nbsp; <span class="tag">#'+TIL.esc(primary)+'</span></span>'+
          '<span class="entry-title">'+TIL.esc(t.title||t.slug||'Untitled')+'</span>'+
          '<span class="entry-preview">'+TIL.esc(t.preview||'')+'</span>'+
          '<span class="entry-tags">'+(t.tags||[]).slice(0,4).map(function(x){
            return '<span>#'+TIL.esc(x)+'</span>'}).join('')+'</span>'+
        '</span>'+
        '<span class="item-arrow">→</span>'+
      '</a>';
    }).join('');
    TIL.reveal('#list [data-reveal]');
  }

  /* related topics — tags that co-occur with this one */
  var related={};
  entries.forEach(function(t){
    (t.tags||[]).forEach(function(x){if(x!==topic)related[x]=(related[x]||0)+1});
  });
  var relKeys=Object.keys(related).sort(function(a,b){return related[b]-related[a]});
  if(relKeys.length){
    document.getElementById('relatedWrap').style.display='block';
    document.getElementById('related').innerHTML=relKeys.map(function(x){
      return '<a class="pill" style="--c:'+TIL.color(x)+'" href="./topic.html?t='+
        encodeURIComponent(x)+'"><span class="swatch"></span>#'+TIL.esc(x)+'</a>';
    }).join('');
  }

  /* keyboard shortcuts */
  var nav=TIL.rover(listEl,'.item');
  function goHome(){location.href='./index.html';}
  function goRandom(){
    if(!TILS.length)return;
    var r=TILS[Math.floor(Math.random()*TILS.length)];
    location.href='./til.html?id='+encodeURIComponent(r.slug);
  }
  TIL.initShortcuts([
    {keys:['j'],hint:['j'],desc:'Highlight next entry',run:nav.next},
    {keys:['k'],hint:['k'],desc:'Highlight previous entry',run:nav.prev},
    {keys:['Enter','o'],hint:['↵'],desc:'Open highlighted entry',run:nav.open},
    {keys:['h'],hint:['h'],desc:'Back to all entries',run:goHome},
    {keys:['r'],hint:['r'],desc:'Open a random post',run:goRandom},
    {keys:['t'],hint:['t'],desc:'Toggle light / dark theme',run:TIL.toggleTheme},
    {keys:['?'],hint:['?'],desc:'Show / hide this panel'},
  ]);
</script>
</body>
</html>
