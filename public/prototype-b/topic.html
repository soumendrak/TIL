<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Topic — TIL</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script>(function(){try{var t=localStorage.getItem('til-theme-b');if(t==='dark')document.documentElement.classList.add('dark');else if(!t&&matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.classList.add('dark');}catch(e){}})();</script>
<style>
  :root{--bg:#fff;--surface:#fafafa;--surface-2:#f4f4f5;--fg:#18181b;--fg-dim:#71717a;--fg-soft:#a1a1aa;--border:#e4e4e7;--accent:#2f6fed;
    --pill-1-bg:#dbeafe;--pill-1-fg:#1e40af;--pill-2-bg:#dcfce7;--pill-2-fg:#166534;--pill-3-bg:#fef3c7;--pill-3-fg:#92400e;
    --pill-4-bg:#fce7f3;--pill-4-fg:#9f1239;--pill-5-bg:#ede9fe;--pill-5-fg:#5b21b6;--pill-6-bg:#e0f2fe;--pill-6-fg:#0c4a6e;}
  html.dark{--bg:#0f0f11;--surface:#16161a;--surface-2:#1c1c22;--fg:#f4f4f5;--fg-dim:#a1a1aa;--fg-soft:#71717a;--border:#27272a;--accent:#6b9aff;
    --pill-1-bg:#1e3a8a40;--pill-1-fg:#bfdbfe;--pill-2-bg:#14532d40;--pill-2-fg:#bbf7d0;--pill-3-bg:#78350f40;--pill-3-fg:#fde68a;
    --pill-4-bg:#831a4540;--pill-4-fg:#fbcfe8;--pill-5-bg:#4c1d9540;--pill-5-fg:#ddd6fe;--pill-6-bg:#0c4a6e40;--pill-6-fg:#bae6fd;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.6}
  a{color:inherit;text-decoration:none}
  header{border-bottom:1px solid var(--border);padding:18px 32px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(12px);z-index:10}
  header .brand{font-weight:700;font-size:15px}
  header .brand a{color:var(--fg-dim)}
  header .brand a:hover{color:var(--fg)}
  .theme-toggle{padding:6px 12px;border:1px solid var(--border);background:transparent;color:var(--fg);border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
  main{max-width:760px;margin:0 auto;padding:56px 32px}
  .crumbs{color:var(--fg-dim);font-size:13px;margin-bottom:18px}
  .crumbs a:hover{color:var(--accent)}
  h1{font-size:36px;font-weight:700;letter-spacing:-.02em}
  h1 .hash{color:var(--accent)}
  .meta{color:var(--fg-dim);margin:8px 0 36px;font-size:14px}
  .card{display:block;padding:20px 22px;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:12px;transition:all .15s ease}
  .card:hover{border-color:var(--fg-soft);transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.04)}
  html.dark .card:hover{box-shadow:0 4px 12px rgba(0,0,0,.3)}
  .card .m{font-size:12px;color:var(--fg-dim);margin-bottom:6px}
  .card h3{font-size:17px;font-weight:600;margin-bottom:6px}
  .card .preview{color:var(--fg-dim);font-size:14px;margin-bottom:10px}
  .pills{display:flex;flex-wrap:wrap;gap:6px}
  .pill{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:500}
  .empty{padding:48px 0;text-align:center;color:var(--fg-dim)}
</style>
</head>
<body>
  <header>
    <div class="brand"><a href="./index.html">til.soumendra.net</a></div>
    <button class="theme-toggle" id="themeBtn">Toggle theme</button>
  </header>
  <main>
    <div class="crumbs"><a href="./index.html">Home</a> / Topics / <span id="bc"></span></div>
    <h1><span class="hash">#</span> <span id="title"></span></h1>
    <p class="meta"><span id="count">0</span> entries</p>
    <div id="list"></div>
  </main>
<script src="./data.js"></script>
<script>
  document.getElementById('themeBtn').onclick=function(){document.documentElement.classList.toggle('dark');localStorage.setItem('til-theme-b',document.documentElement.classList.contains('dark')?'dark':'light');};
  var t=new URLSearchParams(location.search).get('t')||'observability';
  document.getElementById('title').textContent=t;document.getElementById('bc').textContent=t;
  document.title=t+' — TIL';
  function pillClass(tag){var h=0;for(var i=0;i<tag.length;i++)h=(h*31+tag.charCodeAt(i))>>>0;return 'pill-'+(h%6+1);}
  var f=TILS.filter(function(x){return x.tags.indexOf(t)>=0});
  document.getElementById('count').textContent=f.length;
  var listEl=document.getElementById('list');
  if(!f.length){listEl.innerHTML='<div class="empty">No entries yet.</div>';}
  f.forEach(function(x){
    var a=document.createElement('a');a.className='card';a.href='./til.html?id='+x.slug;
    a.innerHTML='<div class="m">'+x.date+' · '+x.read+' min</div>'+
      '<h3>'+x.title+'</h3><p class="preview">'+x.preview+'</p>'+
      '<div class="pills">'+x.tags.map(function(y){var c=pillClass(y);return '<span class="pill" style="background:var(--'+c+'-bg);color:var(--'+c+'-fg)">'+y+'</span>'}).join('')+'</div>';
    listEl.appendChild(a);
  });
</script>
</body></html>
