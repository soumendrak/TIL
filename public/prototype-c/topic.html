<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Topic — Dev Journal</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script>(function(){try{var t=localStorage.getItem('til-theme-c');if(t!=='light')document.documentElement.classList.add('dark');}catch(e){document.documentElement.classList.add('dark');}})();</script>
<style>
  :root{--bg:#fbfaf7;--surface:#fff;--fg:#1a1625;--fg-dim:#6b6478;--border:#ece8e1;--accent:#ff7a45;--tag-bg:#f4f0ea;--tag-fg:#3a2e4a}
  html.dark{--bg:#0f0d18;--surface:#171425;--fg:#f0ecf7;--fg-dim:#9590a8;--border:#231f33;--accent:#ff8a5a;--tag-bg:#1e1a2e;--tag-fg:#c8c0db}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg);font-family:'Space Grotesk',system-ui,sans-serif;font-size:15px;line-height:1.55}
  a{color:inherit;text-decoration:none}
  header{padding:20px 36px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .brand{font-weight:700}.brand .dot{color:var(--accent)}
  .theme-toggle{padding:8px 12px;border:1px solid var(--border);background:transparent;color:var(--fg);border-radius:10px;cursor:pointer;font:inherit;font-size:13px}
  main{max-width:880px;margin:0 auto;padding:48px 36px}
  .crumbs{color:var(--fg-dim);font-size:13px;margin-bottom:14px;font-family:'JetBrains Mono',monospace}
  .crumbs a:hover{color:var(--accent)}
  h1{font-size:44px;font-weight:700;letter-spacing:-.03em;display:flex;align-items:center;gap:12px}
  h1 .emoji{font-size:36px}
  h1 .hash{color:var(--accent)}
  .meta{color:var(--fg-dim);margin:10px 0 32px;font-size:14px}
  .item{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--border)}
  .icon{flex:0 0 44px;height:44px;border-radius:12px;background:var(--tag-bg);display:flex;align-items:center;justify-content:center;font-size:22px}
  .body{flex:1;min-width:0}
  .m{font-size:12px;color:var(--fg-dim);font-family:'JetBrains Mono',monospace;margin-bottom:2px}
  h3{font-size:16px;font-weight:600}
  h3 a:hover{color:var(--accent)}
  .preview{color:var(--fg-dim);font-size:14px;margin-top:4px}
  .empty{padding:48px;text-align:center;color:var(--fg-dim);border:1px dashed var(--border);border-radius:14px}
</style>
</head>
<body>
  <header>
    <a class="brand" href="./index.html">dev<span class="dot">.</span>journal</a>
    <button class="theme-toggle" id="themeBtn">Toggle theme</button>
  </header>
  <main>
    <div class="crumbs"><a href="./index.html">~/journal</a> / topic / <span id="bc"></span></div>
    <h1><span class="emoji" id="emoji">📝</span> <span class="hash">#</span><span id="title"></span></h1>
    <p class="meta"><span id="count">0</span> entries filed under this tag</p>
    <div id="list"></div>
  </main>
<script src="./data.js"></script>
<script>
  var TOPIC_EMOJI={python:'🐍',llm:'🤖',observability:'📡',otel:'📡',signoz:'📊',docker:'🐳',kubernetes:'☸',ci:'⚙️','github-actions':'⚙️',typescript:'🧩',rust:'🦀',wasm:'⚡',debug:'🪲',async:'⏱',linux:'🐧',git:'🌿',cli:'⌨'};
  document.getElementById('themeBtn').onclick=function(){document.documentElement.classList.toggle('dark');localStorage.setItem('til-theme-c',document.documentElement.classList.contains('dark')?'dark':'light');};
  var t=new URLSearchParams(location.search).get('t')||'observability';
  document.getElementById('title').textContent=t;document.getElementById('bc').textContent=t;
  document.getElementById('emoji').textContent=TOPIC_EMOJI[t]||'📝';
  document.title='#'+t+' — Dev Journal';
  var f=TILS.filter(function(x){return x.tags.indexOf(t)>=0});
  document.getElementById('count').textContent=f.length;
  var listEl=document.getElementById('list');
  if(!f.length){listEl.innerHTML='<div class="empty">No entries yet under #'+t+'.</div>';return;}
  function emoji(tags){for(var i=0;i<tags.length;i++)if(TOPIC_EMOJI[tags[i]])return TOPIC_EMOJI[tags[i]];return '📝';}
  listEl.innerHTML=f.map(function(x){
    return '<div class="item"><div class="icon">'+emoji(x.tags)+'</div><div class="body">'+
      '<div class="m">'+x.date+' · '+x.read+'min</div>'+
      '<h3><a href="./til.html?id='+x.slug+'">'+x.title+'</a></h3>'+
      '<p class="preview">'+x.preview+'</p></div></div>';
  }).join('');
</script>
</body></html>
